name: Sync Books

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: books-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest issues
        run: bash scripts/sync_books.sh

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "books-sync[bot]"
          git config user.email "books-sync[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(books): sync latest issues $(date -u +%Y-%m-%d) [skip ci]"
          git push
